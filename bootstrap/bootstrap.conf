config system global
    set hostname "${hostname}"
    set admintimeout 480
    set alias "${alias} - FortiOS ${fortigate_version}"
    set timezone "America/Los_Angeles"
    set gui-theme red
    set gui-allow-default-hostname enable
    set gui-forticare-registration-setup-warning disable
end

config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password "${admin_password}"
    next
end

config system geneve
    edit "gcp"
        set interface "port1"
        set type ppp
        set remote-ip ${producer_gateway}
    next
end

config system probe-response
    set port 8008
    set http-probe-value "OK"
    set mode http-probe
end

conf firewall service custom
    edit "probe8008"
        set tcp-portrange 8008
    next
end

config system interface
    edit "port1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh http probe-response
        set type physical
        set mtu-override enable
        set mtu 1600
    next
    edit "port2"
        set vdom "root"
        set vrf 5
        set allowaccess ping https ssh snmp http telnet radius-acct probe-response fabric ftm speed-test
        set type physical
        set mtu-override enable
        set mtu 1460
    next
    edit "gcp"
        set vdom "root"
        set type geneve
        set snmp-index 9
        set interface "port1"
        set mtu-override enable
        set mtu 1522
    next
    edit "loop1"
        set vdom "root"
        set ip 1.1.1.1 255.255.255.255
        set allowaccess probe-response
        set type loopback
    next
end
end

config router static
    edit 1
        set gateway ${mgmt_gateway}
        set device "port2"
    next
    edit 2
        set dst 130.211.0.0 255.255.252.0
        set gateway ${producer_gateway}
        set device "port1"
    next
    edit 3
        set dst 35.191.0.0 255.255.0.0
        set gateway ${producer_gateway}
        set device "port1"
    next
    edit 4
        set distance 5
        set device "gcp"
    next
    edit 5
        set gateway ${producer_gateway}
        set device "port1"
    next
end

config router policy
    edit 1
        set input-device "port1"
        set srcaddr "all"
        set dstaddr "all"
        set gateway ${producer_gateway}
        set output-device "port1"
    next
    edit 2
        set input-device "gcp"
        set srcaddr "all"
        set dstaddr "all"
        set output-device "gcp"
    next
end

config firewall vip
    edit "loop_hc_vip"
        set extip ${frontend_ip}
        set mappedip "1.1.1.1"
        set extintf "any"
        set portforward enable
        set extport 8008
        set mappedport 8008
    next
end

config webfilter profile
    edit "plpr"
        set comment "Default web filtering."
        config ftgd-wf
            unset options
            config filters
                edit 1
                    set category 1
                    set action block
                next
                edit 2
                    set category 36
                    set action block
                next
                edit 3
                    set category 37
                    set action block
                next
                edit 4
                    set category 30
                    set action block
                next
                edit 5
                    set category 14
                    set action block
                next
            end
        end
        set log-all-url enable
    next
end

config firewall ssl-ssh-profile
    edit "custom-cert"
        set comment "Read-only SSL handshake inspection profile."
        config https
            set ports 443
            set status certificate-inspection
            set quic bypass
        end
        config ftps
            set status disable
        end
        config imaps
            set status disable
        end
        config pop3s
            set status disable
        end
        config smtps
            set status disable
        end
        config ssh
            set ports 22
            set status disable
        end
        config dot
            set status disable
            set quic inspect
        end
    next
end

config firewall policy
    edit 3
        set name "test"
        set srcintf "gcp"
        set dstintf "gcp"
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "PING"
        set logtraffic disable
    next
    edit 4
        set name "genevepolicy"
        set srcintf "gcp"
        set dstintf "gcp"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ssl-ssh-profile "custom-cert"
        set webfilter-profile "plpr"
        set logtraffic all
    next
    edit 5
        set name "healthcheck_loop"
        set srcintf "port1"
        set dstintf "loop1"
        set action accept
        set srcaddr "all"
        set dstaddr "loop_hc_vip"
        set schedule "always"
        set service "probe8008"
        set nat enable
    next
end
end





